name: Release artifacts (no deployment)

# INFRA-081. Builds, signs and attests release artifacts from a version tag.
# It deploys nothing: there is no approved region or production environment
# yet (ADR-0005 is Deferred), so no job holds deployment credentials. Since
# the REL-002 cutover (ADR-0044) a store build is possible, but only with the
# production defines contract and the owner's signing, which CI never holds;
# this workflow proves the release checks are in place, and builds no store
# artifact.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  server-images:
    name: API and worker images with SBOM and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        component: [api, worker]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # BuildKit attaches an SPDX SBOM and SLSA provenance to the pushed
      # image; the digest is what gets attested and what a deploy must pin.
      - name: Build and push ${{ matrix.component }}
        id: build
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/studafy-${COMPONENT}"
          docker buildx create --use --name studafy-release
          docker buildx build \
            --file "apps/${COMPONENT}/Dockerfile" \
            --tag "${image}:${GITHUB_REF_NAME}" \
            --tag "${image}:sha-${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file metadata.json \
            --push .
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  mobile:
    name: Mobile build identity and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # REL-002 (ADR-0044): a release build is production under the
      # production defines contract, or the development test copy (ADR-0042).
      - name: Verify the release checks are wired in
        run: |
          grep -q 'val releaseAppEnvs = setOf("production", "development")' android/app/build.gradle.kts
          grep -q 'checkProductionDefines(repositoryRoot)' android/app/build.gradle.kts
          grep -q 'scripts/release/ios-release-check.sh' ios/Runner.xcodeproj/project.pbxproj

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Compute CI-owned build number
        id: number
        run: echo "build=$(.github/scripts/build-number.sh)" >> "$GITHUB_OUTPUT"

      # The synthetic debug build is the only mobile artifact this workflow
      # makes: CI holds no upload key. It carries the CI build number so the
      # numbering is exercised now.
      - name: Build synthetic debug APK with the CI build number
        run: >-
          flutter build apk --debug
          --dart-define=APP_ENV=synthetic
          --build-number=${{ steps.number.outputs.build }}

      - name: Confirm the Android release check refuses and admits as designed
        run: .github/scripts/check-android-release-guard.sh

      - name: Confirm the iOS release check refuses and admits as designed
        run: .github/scripts/check-ios-release-guard.sh
