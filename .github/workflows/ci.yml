name: CI (no deployment)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. No job receives deployment credentials or environment access.
permissions:
  contents: read

jobs:
  flutter:
    name: Flutter quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Set up Bun for contract generation
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # generate:check now builds the OpenAPI document from the zod contracts,
      # so this job needs the workspace dependencies, not just Bun itself.
      - name: Install pinned tool dependencies
        run: bun install --frozen-lockfile

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tools

      - name: Verify generated Dart API client
        run: bun run generate:check

      # MOB-070: the generated localizations are checked in so the build never
      # depends on codegen having run and a reviewer can read the diff. This
      # fails if someone edits an .arb without regenerating.
      - name: Verify generated localizations
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n/

      - name: Enforce Dart architecture boundaries
        run: dart run tools/check_dart_bounds.dart

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  # The Android build has its own job (2026-10-11). Inside the Flutter job it
  # ran past that job's 30 minutes, and once the runner itself disappeared
  # with no log: the project lets Gradle take an 8 GB heap plus 4 GB of
  # metaspace, with the Kotlin daemon beside it, on a 16 GB runner. Here
  # Gradle is cached and held to what the runner has; developers' machines
  # keep the project setting.
  android-debug-build:
    name: Android synthetic debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      # User-level Gradle properties win over the project's, so only CI is
      # capped.
      - name: Fit Gradle into the runner's memory
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError'
            echo 'kotlin.daemon.jvmargs=-Xmx2g'
            echo 'org.gradle.workers.max=2'
          } >> ~/.gradle/gradle.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      # One architecture is enough to prove the app builds; arm64 is what
      # phones run.
      - name: Verify synthetic debug build
        run: >-
          flutter build apk --debug --target-platform android-arm64
          --dart-define=APP_ENV=synthetic

      # SEC-001, narrowed by ADR-0042: a release build is allowed only for
      # the development test copy, signed with an upload key CI never holds.
      # Each case is refused at Gradle's task graph, before compilation.
      - name: Verify the Android release guard
        run: .github/scripts/check-android-release-guard.sh

  edge-functions:
    name: Edge Function quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6

      - name: Install pinned tool dependencies
        run: bun install --frozen-lockfile

      - name: Verify Edge Function formatting
        run: deno fmt --check

      - name: Lint Edge Functions
        run: deno lint

      - name: Type-check Edge Functions
        run: deno check --frozen=true supabase/functions/*/index.ts supabase/functions/_shared/*.ts

      - name: Run Edge Function tests
        run: deno test --frozen=true

      - name: Audit Bun dependencies
        run: bun audit --audit-level high

  database:
    name: Local Supabase upgrade, recovery, schema, and RLS validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    services:
      # OPS-061: the outbox end-to-end suite needs a queue backend next to the
      # durable outbox. The dev posture (non-evicting, persisted) is pinned in
      # docker-compose.dev.yml; this service matches it.
      redis:
        image: redis:7.4.4-alpine3.21@sha256:ee9e8748ace004102a267f7b8265dab2c618317df22507b89d16a8add7154273
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Deno for deterministic generated-type formatting
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6

      - name: Install pinned tool dependencies
        run: bun install --frozen-lockfile

      # Every command is explicitly local. The checkout has no linked-project state.
      - name: Start disposable local Supabase stack
        run: bunx supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      - name: Reset to the pre-DB-020 migration boundary
        run: bunx supabase db reset --local --version 202609090004 --no-seed

      - name: Load synthetic legacy multi-school fixture
        run: bun scripts/run-local-sql.ts supabase/tests/db020_legacy_seed.sql

      - name: Checksum and restore the pre-upgrade logical backup
        run: bun scripts/rehearse-recovery.ts

      - name: Apply forward migrations through DB-021
        run: bunx supabase migration up --local

      - name: Verify legacy identifier, row, lifecycle, and tenant preservation
        run: bunx supabase test db --local supabase/tests/db020_upgrade.sql

      - name: Reset to the DB-020 migration boundary
        run: bunx supabase db reset --local --version 202609110006 --no-seed

      - name: Load synthetic DB-021 upgrade fixture
        run: bun scripts/run-local-sql.ts supabase/tests/db021_upgrade_seed.sql

      - name: Apply the six DB-021 forward migrations
        run: bunx supabase migration up --local

      - name: Verify DB-021 upgrade preservation and grants
        run: >-
          bunx supabase test db --local
          supabase/tests/db021_upgrade.sql
          supabase/tests/db021_grants.sql

      - name: Replay all migrations from zero
        run: bunx supabase db reset --local --no-seed

      - name: Lint local database
        run: bunx supabase db lint --local --level error --fail-on error

      - name: Run SEC-001 RLS containment tests
        run: bunx supabase test db --local supabase/tests/containment.sql

      # The seed file is the synthetic data generator (ARC-001/TEST-006): it
      # creates the cross-school fixture and includes rls_access.sql itself.
      - name: Run multi-school RLS access tests
        run: bunx supabase test db --local supabase/tests/rls_access_seed.sql

      - name: Run DB-020 tenant and lifecycle constraint tests
        run: bunx supabase test db --local supabase/tests/db020_constraints.sql

      - name: Run DB-021 multi-role policy and RPC tests
        run: bunx supabase test db --local supabase/tests/db021_access_seed.sql

      - name: Run AUTH-030 session, device, reauth, and deletion tests
        run: bunx supabase test db --local supabase/tests/auth030_access.sql

      - name: Prove AUTH-031 action/resource decisions match DB-021 RLS
        run: >-
          bunx supabase test db --local
          supabase/tests/auth031_authorization_seed.sql

      - name: Verify DB-021 grant and function surface
        run: bunx supabase test db --local supabase/tests/db021_grants.sql

      - name: Verify the AUTH-030 API grant surface stays least-privilege
        run: bunx supabase test db --local supabase/tests/auth030_grants.sql

      - name: Verify API-040 durable idempotency and grant boundaries
        run: >-
          bunx supabase test db --local
          supabase/tests/api040_idempotency_seed.sql

      # API-041: transaction coupling (forced audit/outbox rollback),
      # idempotency completion, cross-tenant concealment and the least
      # privilege query/command surface.
      - name: Verify API-041 authoritative academic surface
        run: >-
          bunx supabase test db --local
          supabase/tests/api041_academic_seed.sql

      - name: Verify FILE-050 upload metadata, quotas, and quarantine
        run: >-
          bunx supabase test db --local
          supabase/tests/file050_upload_seed.sql

      # FILE-051: scan state machine, single-object publication for thirty
      # recipients, school-scoped dedupe, single-use re-authorized grants,
      # retention units, containment/release, and the runtime grant surface.
      - name: Verify FILE-051 scanning, publication, dedupe, delivery, and retention
        run: >-
          bunx supabase test db --local
          supabase/tests/file051_scan_delivery_seed.sql

      # AI-072 (ADR-0026): retired AI relations have no grant or policy and
      # refuse every write, the draft-review branch is unreachable, the Study
      # Coach upload purpose and both AI store products cannot come back.
      - name: Verify AI-072 removal leaves no AI data path
        run: >-
          bunx supabase test db --local
          supabase/tests/ai072_removal_seed.sql

      # PAY-071 audit follow-up: lineage ownership across accounts, the
      # storefront gate on first-seen restores, guardian entitlement reads,
      # the self-purchase switch, and the ledger's lifecycle history.
      - name: Verify PAY-071 billing ledger trust boundary
        run: >-
          bunx supabase test db --local
          supabase/tests/pay071_billing_seed.sql

      # ADR-0029: Lessons are free; Studafy Plus / Max are decided on the
      # server from store entitlements and grants; the AI ledger refuses a
      # call that would pass a plan's monthly cap before any provider is
      # called. Seeds its own fixtures, so it is run directly.
      - name: Verify free Lessons, study plans, and the AI spending ledger
        run: >-
          bunx supabase test db --local
          supabase/tests/study_plans.sql

      # Store webhook events are claimed and finished, each event lands on
      # the transaction it names (an Android upgrade's old token cannot
      # expire the new plan), lost renewals are re-verified, and only
      # verified entitlement changes notify the payer. Transactional.
      # Lesson notes are made once per lesson version and shared; the same
      # whiteboard photo returns the note already made while it exists.
      - name: Verify AI output is made once and reused
        run: >-
          bunx supabase test db --local
          supabase/tests/ai_output_cache.sql

      # A parent links only to a student: never a teacher's or other staff
      # account, never their own. Transactional.
      - name: Verify guardian links reach students only
        run: >-
          bunx supabase test db --local
          supabase/tests/guardian_links_students_only.sql

      # A student has one Studafy ID however many teachers' schools they
      # join; a parent finds them by it, and nobody else can hold it.
      - name: Verify one Studafy ID per student
        run: >-
          bunx supabase test db --local
          supabase/tests/one_studafy_id.sql

      # One kind of account per email: a student account is a student only;
      # an adult's may be a teacher, a parent or both.
      - name: Verify one kind of account per email
        run: >-
          bunx supabase test db --local
          supabase/tests/one_kind_per_account.sql

      # Every account's numeric Studafy ID, and renaming oneself.
      - name: Verify numeric Studafy IDs and renaming
        run: >-
          bunx supabase test db --local
          supabase/tests/numeric_public_id.sql

      # Plus, Max and Family+ are sold from launch (ADR-0034).
      - name: Verify the launch plans are listed
        run: >-
          bunx supabase test db --local
          supabase/tests/paid_plans_listed.sql

      # Expired idempotency records are pruned by the worker; live and
      # in-flight ones are kept. Transactional.
      - name: Verify housekeeping
        run: >-
          bunx supabase test db --local
          supabase/tests/housekeeping.sql

      - name: Verify the subscription lifecycle
        run: >-
          bunx supabase test db --local
          supabase/tests/subscription_lifecycle.sql

      - name: Verify Google Play voided purchases
        run: >-
          bunx supabase test db --local
          supabase/tests/voided_purchases.sql

      - name: Verify managed child accounts
        run: >-
          bunx supabase test db --local
          supabase/tests/managed_accounts.sql

      - name: Verify first-sign-in profile setup
        run: >-
          bunx supabase test db --local
          supabase/tests/profile_setup.sql

      - name: Verify deleting a class keeps students' notebooks
        run: >-
          bunx supabase test db --local
          supabase/tests/archive_classes.sql

      - name: Verify what the study helper may read
        run: >-
          bunx supabase test db --local
          supabase/tests/assistant_material.sql

      # Paper gradebook, attendance corrections, deadlines and coursework
      # files (2026-09-30). Each suite seeds and rolls back its own fixtures.
      - name: Verify paper grades, corrections, deadlines and downloads
        run: >-
          bunx supabase test db --local
          supabase/tests/paper_gradebook.sql
          supabase/tests/attendance_corrections.sql
          supabase/tests/submission_deadlines.sql
          supabase/tests/coursework_files.sql
          supabase/tests/guardian_announcements.sql
          supabase/tests/online_assessments.sql
          supabase/tests/attachment_refusals.sql
          supabase/tests/bind_refusals.sql
          supabase/tests/grounded_material.sql
          supabase/tests/study_notebooks.sql
          supabase/tests/material_selection.sql

      # API-042: every school-operations slice - account, communications,
      # family, invitations, meetings, notifications, roster, school
      # operations and support access.
      - name: Verify API-042 school operations surface
        run: >-
          bunx supabase test db --local
          supabase/tests/api042_account_seed.sql
          supabase/tests/api042_communications_seed.sql
          supabase/tests/api042_family_seed.sql
          supabase/tests/api042_invitations_seed.sql
          supabase/tests/api042_meetings_seed.sql
          supabase/tests/api042_notifications_seed.sql
          supabase/tests/api042_roster_seed.sql
          supabase/tests/api042_school_operations_seed.sql
          supabase/tests/api042_support_access_seed.sql

      # Self-serve teacher sign-up is the only path to a first membership that
      # does not start from a platform operator, so what it refuses matters as
      # much as what it creates: one workspace per account, revoked members
      # included, and the teacher role rather than a school_admin one that
      # would demand MFA on the first screen after sign-up. Seeds its own
      # fixtures, so it is run directly like the file above.
      - name: Verify self-serve teacher sign-up
        run: >-
          bunx supabase test db --local
          supabase/tests/teacher_self_signup.sql

      # Family+ returns one child's record to whoever paid for it, so the
      # refusals are the point: no subscription, no link, another parent's
      # child, and a safeguarding-restricted note that must never surface at
      # any subscription level. Seeds its own fixtures.
      - name: Verify Family+ entitlement gate
        run: >-
          bunx supabase test db --local
          supabase/tests/family_insights.sql

      # Family+ is a family plan: 4 or 8 children, held by the parent who
      # pays. Which children hold the seats is worked out on every read, so
      # these pin the count, the order, a seat freeing when a link goes, and
      # that the plan never covers another guardian. Seeds its own fixtures.
      - name: Verify Family+ family plans
        run: >-
          bunx supabase test db --local
          supabase/tests/family_plus_tiers.sql

      # Notifications name the people an event is about, so the audience is
      # a disclosure decision: a mark reaches one child's guardian and not
      # the class, a safeguarding-restricted note reaches no family at all,
      # an expired link is not a link, and everything that was staff-only
      # stays staff-only. Seeds its own fixtures.
      - name: Verify notification audiences
        run: >-
          bunx supabase test db --local
          supabase/tests/notification_audiences.sql

      # DL-051: account deletion executes as de-identification that keeps
      # retained records intact and never while held, early or cancelled;
      # data exports contain only the requester's own data.
      - name: Verify account deletion and data export executors
        run: >-
          bunx supabase test db --local
          supabase/tests/account_deletion_seed.sql
          supabase/tests/data_export_seed.sql
          supabase/tests/meeting_processor_seed.sql
          supabase/tests/notification_channels_seed.sql

      # DL-057: timed purges past the append-only guards, class closure and
      # inactive accounts. Transactional; leaves nothing behind.
      - name: Verify the retention schedule
        run: bunx supabase test db --local supabase/tests/retention_schedule.sql

      - name: Verify DB-020 query plans and provisional local latency bounds
        run: bun run test:plans:tenancy

      - name: Verify API-041 cursor query plans
        run: bun run test:plans:academic

      - name: Verify paper gradebook, attendance and deadline query plans
        run: bun run test:plans:coursework

      - name: Verify FILE-050 quota, status, expiry, and outbox query plans
        run: bun run test:plans:uploads

      - name: Verify FILE-051 grant, scan, dedupe, and retention query plans
        run: bun run test:plans:delivery

      - name: Verify DB-021 RLS plans and provisional local latency bounds
        run: bun run test:plans:rls

      - name: Verify generated public database types
        run: bun run generate:db-types:check

      # ARC-010: read-only connectivity smoke from the workspace database
      # package against the disposable stack database.
      - name: Run database package connectivity smoke
        run: DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres bun test packages/database

      # Every API and worker integration suite, found by name rather than
      # listed, so a new suite runs in CI the day it is added. Each exercises
      # the real SQL through postgres.js - route stacks, transactions, outbox
      # and idempotent replays - which the fake-backed unit tests cannot.
      # The OPS-061 outbox suite runs later, after its drain state machine is
      # verified, as its own step.
      - name: Run every API and worker integration suite
        run: >-
          REDIS_URL=redis://127.0.0.1:6379
          bun test apps/api/test/auth
          $(find apps packages -name '*.integration.test.ts'
          -not -path '*/node_modules/*'
          -not -name 'outbox.integration.test.ts' | sort)

      # FILE-050: use a real local signed capability and prove the token cannot
      # be redirected to a substituted object key.
      - name: Run FILE-050 signed-upload path-binding integration suite
        run: bun run test:uploads:storage

      # FILE-051: the whole lifecycle over real Storage with the API and
      # worker connected as their least-privilege runtime roles — transform,
      # publication, single-use delivery, revocation, rejection, dedupe with
      # physical cleanup, and bucket/row reconciliation.
      - name: Run FILE-051 end-to-end delivery verification
        run: bun run test:delivery:e2e

      # FILE-051 gate: the malicious-file response exercise from the runbook.
      - name: Run FILE-051 malicious-file response drill
        run: bun run test:delivery:malware-drill

      - name: Verify FILE-051 storage reconciliation after the drills
        run: bun run test:delivery:reconcile

      # SAFE-043: schema shape/RLS/no-grant assertions, then the surface
      # fixture (seed file includes safe043_surface.sql itself), proving the
      # reports/queue/masking/holds/blocks contract against the real stack.
      - name: Verify SAFE-043 safety schema shape and grants
        run: bunx supabase test db --local supabase/tests/safe043_safety_schema.sql

      - name: Verify SAFE-043 reporting, moderation, holds, and blocks surface
        run: bunx supabase test db --local supabase/tests/safe043_surface_seed.sql

      # On call: the drill drives the real SQL dispatcher through the whole
      # safeguarding lifecycle and exits non-zero on any step failing.
      - name: Run SAFE-043 moderation drill
        run: >-
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          bun scripts/moderation-drill.ts

      # OPS-061: the outbox drain state machine — claim/lease/bookkeeping,
      # idempotent expansion, terminal dead-lettering, DLQ redrive, grants.
      - name: Verify OPS-061 outbox drain state machine
        run: bunx supabase test db --local supabase/tests/ops061_outbox_seed.sql

      - name: Verify OPS-061 outbox query plans
        run: bun run test:plans:outbox

      # OPS-061 end-to-end: crash mid-job, failover, duplicate delivery,
      # poison message, and backlog drain over the real queue + database.
      - name: Run OPS-061 outbox queue end-to-end suite
        run: >-
          REDIS_URL=redis://127.0.0.1:6379
          bun run test:outbox:e2e

      # End-to-end against the live local GoTrue: real ES256 tokens, real JWKS,
      # and the least-privilege database role.
      - name: Verify the AUTH-030 lifecycle end to end
        run: |
          # `status -o env` also prints a non-assignment "Stopped services"
          # line, so only KEY="value" lines are exported.
          eval "$(bunx supabase status -o env | grep -E '^[A-Z_]+="' | sed 's/^/export /')"
          SUPABASE_URL=http://127.0.0.1:54321 \
          SUPABASE_SECRET_KEY="$SECRET_KEY" \
          SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
          bun run test:auth:lifecycle

      - name: Stop disposable Supabase stack
        if: always()
        run: bunx supabase stop --no-backup

  workspace:
    name: Bun workspace quality and containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4.4-alpine3.21@sha256:ee9e8748ace004102a267f7b8265dab2c618317df22507b89d16a8add7154273
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history, so the migration gate can compare against main.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6

      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile

      - name: Verify workspace formatting
        run: bun run format:check

      - name: Lint workspace TypeScript
        run: bun run lint

      - name: Enforce architecture boundaries
        run: bun scripts/check-bounds.ts

      # INFRA-081: migrations are forward-only. No applied migration may
      # change, and new ones must sort last against main.
      - name: Enforce forward-only migrations
        run: bun run check:migrations origin/main

      - name: Type-check all workspace members
        run: bun run typecheck

      # The Cloudflare Worker that relays alerts to Telegram (ADR-0035).
      - name: Type-check the alert relay
        run: bunx tsc -p ops/alert-relay

      # scripts/ holds the launcher and Fly-config checks, ops/ the alert
      # relay (ADR-0035); neither needs a database.
      - name: Run workspace tests
        run: bun test apps packages scripts ops
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - name: Build API and worker bundles
        run: bun run --filter='@studafy/api' build && bun run --filter='@studafy/worker' build

      - name: Smoke API container (degraded readiness and graceful shutdown)
        run: |
          docker build -q -f apps/api/Dockerfile -t studafy-api .
          docker run -d --name api-smoke --network host \
            -e ENVIRONMENT=development -e REDIS_URL=redis://127.0.0.1:6379 studafy-api
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz)" = "503"
          curl -s http://127.0.0.1:8080/readyz | grep -q 'database_unreachable'
          # The unauthenticated /v1 probe rides the OPS-060 edge limiter; a
          # dedicated test IP keeps it immune to limiter state left by the
          # workspace test step sharing the same Redis service.
          curl -s -H 'x-forwarded-for: 203.0.113.77' http://127.0.0.1:8080/v1/me | grep -q 'NOT_IMPLEMENTED'
          docker stop -t 10 api-smoke
          test "$(docker inspect api-smoke --format '{{.State.ExitCode}}')" = "0"
          docker logs api-smoke 2>&1 | grep -q '"phase":"complete"'
          docker rm api-smoke >/dev/null

      - name: Smoke worker container (queue lifecycle and graceful shutdown)
        run: |
          docker build -q -f apps/worker/Dockerfile -t studafy-worker .
          docker run -d --name worker-smoke --network host \
            -e ENVIRONMENT=development -e REDIS_URL=redis://127.0.0.1:6379 studafy-worker
          for _ in $(seq 1 20); do
            docker logs worker-smoke 2>&1 | grep -q worker_ready && break; sleep 1
          done
          docker logs worker-smoke 2>&1 | grep -q worker_ready
          REDIS_URL=redis://127.0.0.1:6379 bun -e 'const m = await import("./packages/infrastructure/src/index.ts"); const q = m.createQueue("smoke", process.env.REDIS_URL, { prefix: "studafy-development" }); await q.add("smoke-job", { value: "ci-smoke" }); await m.closeQueue(q);'
          for _ in $(seq 1 20); do
            docker logs worker-smoke 2>&1 | grep -q job_processed && break; sleep 1
          done
          docker logs worker-smoke 2>&1 | grep -q job_processed
          docker stop -t 10 worker-smoke
          test "$(docker inspect worker-smoke --format '{{.State.ExitCode}}')" = "0"
          docker logs worker-smoke 2>&1 | grep -q '"phase":"complete"'
          docker rm worker-smoke >/dev/null

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action resolves the PR commit range through GitHub's pull
    # request API. Scope this read-only permission to this job only; comments
    # and artifact uploads remain disabled below.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked sensitive filenames
        run: .github/scripts/check-sensitive-files.sh

      - name: Scan history and working tree
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependency-scan:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Run locally in the job; do not request SARIF/code-scanning write access.
      - name: Scan Dart and Bun lockfiles for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./
