# Studafy worker on Fly.io (ADR-0035, docs/deployment/fly-io.md).
# Deploy from the repository root:
#   fly deploy --config fly.worker.toml
# Secrets are set with `fly secrets import --config fly.worker.toml`; the
# list is in docs/deployment/fly-io.md, "Production deploy checklist".

app = "studafy-worker"
primary_region = "fra"

[build]
  dockerfile = "apps/worker/Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "info"
  # OPS-090: failed jobs and the per-minute backlog heartbeats are always
  # kept; 1 in 10 routine "job done" lines.
  LOG_SAMPLE_SUCCESS_RATE = "0.1"
  LOG_SAMPLE_ROUTINE_RATE = "0.01"
  DATABASE_POOL_MAX = "10"
  # In-app notifications: without this every notification stays queued and
  # no inbox shows one (the 2026-10-02 incident on hosted).
  OPS061_NOTIFICATIONS_ENABLED = "true"
  # Uploads are scanned before anyone can open them; abandoned ones cleaned.
  FILE051_SCAN_ENABLED = "true"
  FILE050_CLEANUP_ENABLED = "true"
  # Production refuses to scan without an external scanner. This is the
  # private studafy-scanner app (fly.scanner.toml), reachable only over Fly's
  # private network, so plain HTTP never leaves the organisation. Its key,
  # MALWARE_SCANNER_API_KEY, is a secret (the scanner's SCANNER_API_KEY).
  MALWARE_SCANNER_URL = "http://studafy-scanner.internal:8080/scan"
  # Removes the bytes of files whose retention has ended. No file purpose
  # sets a retention period yet, so today this removes only the personal
  # files (profile image, notebook photo, AI-helper photo) of deleted
  # accounts (launch plan 3.6b, 202610110004).
  FILE051_RETENTION_ENABLED = "true"
  DB_HOUSEKEEPING_ENABLED = "true"
  # Account rights (DL-051): App Store 5.1.1(v) and GDPR need deletion and
  # export to complete, not just be requested. They need only the database.
  ACCOUNT_DELETION_EXECUTOR_ENABLED = "true"
  DATA_EXPORT_EXECUTOR_ENABLED = "true"
  # DL-057 retention purge: OFF until the store release carrying consent
  # version 2026-10-14 is live (launch plan D3). Turning it on is that
  # reviewed one-word change here, with the owner's "go".
  RETENTION_SCHEDULE_ENABLED = "false"
  # Launch plan 4.7: backlog alerts to Telegram. Needs the secrets
  # TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID, or the worker refuses to start.
  QUEUE_ALERTS_ENABLED = "true"
  # Switched on at launch once their own credentials are set (see the doc):
  # PAY071_BILLING_ENABLED (store keys), NOTIFICATION_CHANNELS_ENABLED
  # (Firebase / email), MEETINGS_PROCESSOR_ENABLED.

# The worker serves no HTTP. It runs continuously: one machine, never
# stopped for being idle, since queued work arrives without traffic.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
