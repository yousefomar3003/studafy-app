# Studafy API - TEST copy on Fly.io (ADR-0035). Same as the Mac-hosted
# setup: development mode, Cloudflare test Turnstile keys, the Frankfurt
# Supabase project. Not production: see fly.api.toml for that.
#   fly deploy --config fly.test.api.toml
app = "studafy-api-test"
primary_region = "fra"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  ENVIRONMENT = "development"
  API_PORT = "8080"
  # No Cloudflare in front of *.fly.dev: client addresses come from Fly's
  # own Fly-Client-IP, never X-Forwarded-For, which a caller can write
  # (security audit 2026-10-08).
  CLIENT_IP_SOURCE = "fly"
  LOG_LEVEL = "info"
  LOG_SAMPLE_SUCCESS_RATE = "0.1"
  LOG_SAMPLE_ROUTINE_RATE = "0.01"
  LOG_SLOW_REQUEST_MS = "2000"
  DATABASE_POOL_MAX = "10"
  # Supabase's session pooler: the 6543 (transaction pooler) DATABASE_URL
  # secret is moved to port 5432 on the same host, same login. Through the
  # transaction pooler, pipelined statements were stranded and the worker
  # stalled (2026-10-20); production refuses 6543 without this. In session
  # mode every pooled connection holds one of the role's Pool Size slots
  # (docs/deployment/fly-io.md, "Database connection budget").
  DATABASE_POOLER_MODE = "session"
  # Answers from class material run longer than a plain question (ADR-0037).
  API_REQUEST_TIMEOUT_MS = "20000"
  TURNSTILE_ENABLED = "true"
  # What Cloudflare's test keys report; development accepts them only.
  TURNSTILE_HOSTNAMES = "example.com"
  FILE050_NEW_INTENTS_ENABLED = "true"
  FILE051_PUBLISH_ENABLED = "true"
  FILE051_DELIVERY_ENABLED = "true"
  FILE051_DELIVERY_PUBLIC_BASE_URL = "https://studafy-api-test.fly.dev"
  AI_BASE_URL = "https://api.together.xyz"
  AI_MODEL = "Qwen/Qwen3.5-9B"
  # Synthetic lesson material only on the test copy (ADR-0034).
  AI_LESSON_TOOLS_ENABLED = "true"
  # Messaging on, as in production (DL-063).
  MESSAGING_ENABLED = "true"
  # Google Play billing in test (work plan 3.9): license testers buy on the
  # internal-testing build. The store's public settings are here; the Play
  # API key (GOOGLE_SERVICE_ACCOUNT_JSON) is a secret. Pub/Sub pushes to
  # /webhooks/google, signed by the push account below for this audience.
  PAY071_BILLING_ENABLED = "true"
  PAY071_ENVIRONMENT = "development"
  GOOGLE_PACKAGE_NAME = "com.studafy.light"
  GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL = "studafy-pubsub-push@studafy-lite.iam.gserviceaccount.com"
  GOOGLE_PUBSUB_AUDIENCE = "https://studafy-api-test.fly.dev/webhooks/google"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[deploy]
  strategy = "rolling"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
