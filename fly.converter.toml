# Studafy document converter - PRODUCTION (DL-078, DL-079): LibreOffice,
# headless, behind infra/converter/server.py, which speaks the
# HttpDocumentConverter contract. It makes in-app PDF previews of Office
# files and CSV, and the .docx/.xlsx/.pptx copy of an old .doc/.xls/.ppt
# that the AI reads. The same configuration as fly.converter.test.toml
# (scripts/fly-config.test.ts keeps the two equal), with its own app and its
# own key; the test converter is never shared with production.
#
# Private only: there is no [http_service] or [[services]] section, so the
# app gets no public IP and nothing outside the Fly organisation can reach
# it. studafy-worker reaches it over Fly's private network at
#   http://studafy-converter.internal:8080
# (CONVERTER_URL in fly.worker.toml). Its only secret is CONVERTER_API_KEY,
# the same value as the worker's CONVERTER_API_KEY.
#
# Deploy from the repository root (docs/deployment/production-cutover.md;
# scripts/production/cutover.ts runs it):
#   fly deploy --config fly.converter.toml --ha=false
# One machine: while it is away renditions wait and are retried, and
# downloads and everything else keep working.
app = "studafy-converter"
# Frankfurt, next to the worker and the database.
primary_region = "fra"

[build]
  dockerfile = "infra/converter/Dockerfile"

[env]
  PORT = "8080"
  # 25 MB in and out: the upload ceiling.
  MAX_BYTES = "26214400"
  MAX_OUTPUT_BYTES = "26214400"
  # One conversion is killed, with everything it started, after this long.
  TIMEOUT_SECONDS = "90"

# LibreOffice with a large deck or workbook open needs the memory.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2gb"

[[restart]]
  policy = "always"

# A machine check, not a service check: there is no public service. The
# grace period covers LibreOffice's first start and the self-test.
[checks]
  [checks.healthz]
    type = "http"
    port = 8080
    method = "get"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "2m"
