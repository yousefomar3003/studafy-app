name: Backup (database and files)

# An independent, encrypted copy of Studafy's data, every 24 hours: inside
# the 48-hour requirement even when one run fails. Each run restores the
# backup into a throwaway database and checks every table's row count before
# the backup is kept. Runbook: docs/deployment/backups.md.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted backup with restore check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Secrets and variables live in this protected environment only
    # (Settings -> Environments -> backups), never at repository level.
    environment: backups
    permissions:
      contents: read
      # Assumes the AWS role for the optional S3 copy; no stored AWS keys.
      id-token: write
      # Opens an issue when a backup fails.
      issues: write
    services:
      # Same image as the hosted database's major version: the restore check
      # needs Supabase's roles and schemas, which plain Postgres lacks.
      restore:
        image: public.ecr.aws/supabase/postgres:17.6.1.166
        env:
          POSTGRES_PASSWORD: restore-check-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check the backup is configured
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
        run: |
          missing=""
          [ -n "$BACKUP_DATABASE_URL" ] || missing="$missing secret:BACKUP_DATABASE_URL"
          [ -n "$BACKUP_AGE_RECIPIENTS" ] || missing="$missing variable:BACKUP_AGE_RECIPIENTS"
          if [ -n "$missing" ]; then
            echo "::error::The backups environment is missing:$missing (docs/deployment/backups.md)"
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the PostgreSQL 17 client and age
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Back up the database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_OUT: ${{ runner.temp }}/backup
        run: bun scripts/backup/backup-database.ts

      - name: Export uploaded files
        if: vars.BACKUP_INCLUDE_STORAGE == 'true'
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_OUT: ${{ runner.temp }}/backup
        run: bun scripts/backup/export-storage.ts

      - name: Restore into a throwaway database and check it
        env:
          RESTORE_ADMIN_URL: postgresql://supabase_admin:restore-check-only@127.0.0.1:55432/postgres
          BACKUP_DIR: ${{ runner.temp }}/backup
        run: bash scripts/backup/restore-database.sh

      - name: Encrypt, then delete the plaintext
        id: encrypt
        env:
          BACKUP_AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
          BACKUP_OUT: ${{ runner.temp }}/backup
        run: |
          set -euo pipefail
          name="studafy-backup-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$RUNNER_TEMP/encrypted"
          printf '%s\n' "$BACKUP_AGE_RECIPIENTS" > "$RUNNER_TEMP/recipients.txt"
          tar -C "$BACKUP_OUT" -cf - . \
            | age --encrypt --recipients-file "$RUNNER_TEMP/recipients.txt" \
              --output "$RUNNER_TEMP/encrypted/$name.tar.age"
          rm -rf "$BACKUP_OUT"
          (cd "$RUNNER_TEMP/encrypted" && sha256sum "$name.tar.age" > "$name.tar.age.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "encrypted backup: $(du -h "$RUNNER_TEMP/encrypted/$name.tar.age" | cut -f1)"

      - name: Keep the encrypted backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.encrypt.outputs.name }}
          path: ${{ runner.temp }}/encrypted/
          retention-days: ${{ vars.BACKUP_RETENTION_DAYS || 30 }}
          compression-level: 0
          if-no-files-found: error

      - name: Sign in to AWS for the off-site copy
        if: vars.BACKUP_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BACKUP_AWS_ROLE_ARN }}
          aws-region: ${{ vars.BACKUP_AWS_REGION || 'il-central-1' }}

      - name: Copy off-site to S3
        if: vars.BACKUP_S3_BUCKET != ''
        env:
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          NAME: ${{ steps.encrypt.outputs.name }}
        run: |
          for file in "$RUNNER_TEMP/encrypted/"*; do
            aws s3 cp "$file" "s3://$BUCKET/studafy/$(basename "$file")" \
              --sse aws:kms --only-show-errors
          done

      - name: Open an issue for a failed backup
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Backup failed on $(date -u +%Y-%m-%d)" \
            --body "The scheduled backup failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The last good backup is the newest backup artifact. See docs/deployment/backups.md."
