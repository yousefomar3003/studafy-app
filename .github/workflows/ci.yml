name: CI (no deployment)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. No job receives deployment credentials or environment access.
permissions:
  contents: read

jobs:
  flutter:
    name: Flutter quality and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Set up Bun for contract generation
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # generate:check now builds the OpenAPI document from the zod contracts,
      # so this job needs the workspace dependencies, not just Bun itself.
      - name: Install pinned tool dependencies
        run: bun install --frozen-lockfile

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tools

      - name: Verify generated Dart API client
        run: bun run generate:check

      - name: Enforce Dart architecture boundaries
        run: dart run tools/check_dart_bounds.dart

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      # SEC-001 intentionally permits only a synthetic debug artifact.
      - name: Verify synthetic debug build
        run: flutter build apk --debug --dart-define=APP_ENV=synthetic

  edge-functions:
    name: Edge Function quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6

      - name: Install pinned tool dependencies
        run: bun install --frozen-lockfile

      - name: Verify Edge Function formatting
        run: deno fmt --check

      - name: Lint Edge Functions
        run: deno lint

      - name: Type-check Edge Functions
        run: deno check --frozen=true supabase/functions/*/index.ts supabase/functions/_shared/*.ts

      - name: Run Edge Function tests
        run: deno test --frozen=true

      - name: Audit Bun dependencies
        run: bun audit --audit-level high

  database:
    name: Local Supabase upgrade, recovery, schema, and RLS validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Deno for deterministic generated-type formatting
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6

      - name: Install pinned tool dependencies
        run: bun install --frozen-lockfile

      # Every command is explicitly local. The checkout has no linked-project state.
      - name: Start disposable local Supabase stack
        run: bunx supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      - name: Reset to the pre-DB-020 migration boundary
        run: bunx supabase db reset --local --version 202609090004 --no-seed

      - name: Load synthetic legacy multi-school fixture
        run: bun scripts/run-local-sql.ts supabase/tests/db020_legacy_seed.sql

      - name: Checksum and restore the pre-upgrade logical backup
        run: bun scripts/rehearse-db020-recovery.ts

      - name: Apply forward migrations through DB-021
        run: bunx supabase migration up --local

      - name: Verify legacy identifier, row, lifecycle, and tenant preservation
        run: bunx supabase test db --local supabase/tests/db020_upgrade.sql

      - name: Reset to the DB-020 migration boundary
        run: bunx supabase db reset --local --version 202609110006 --no-seed

      - name: Load synthetic DB-021 upgrade fixture
        run: bun scripts/run-local-sql.ts supabase/tests/db021_upgrade_seed.sql

      - name: Apply the six DB-021 forward migrations
        run: bunx supabase migration up --local

      - name: Verify DB-021 upgrade preservation and grants
        run: >-
          bunx supabase test db --local
          supabase/tests/db021_upgrade.sql
          supabase/tests/db021_grants.sql

      - name: Replay all migrations from zero
        run: bunx supabase db reset --local --no-seed

      - name: Lint local database
        run: bunx supabase db lint --local --level error --fail-on error

      - name: Run SEC-001 RLS containment tests
        run: bunx supabase test db --local supabase/tests/containment.sql

      # The seed file is the synthetic data generator (ARC-001/TEST-006): it
      # creates the cross-school fixture and includes rls_access.sql itself.
      - name: Run multi-school RLS access tests
        run: bunx supabase test db --local supabase/tests/rls_access_seed.sql

      - name: Run DB-020 tenant and lifecycle constraint tests
        run: bunx supabase test db --local supabase/tests/db020_constraints.sql

      - name: Run DB-021 multi-role policy and RPC tests
        run: bunx supabase test db --local supabase/tests/db021_access_seed.sql

      - name: Run AUTH-030 session, device, reauth, and deletion tests
        run: bunx supabase test db --local supabase/tests/auth030_access.sql

      - name: Prove AUTH-031 action/resource decisions match DB-021 RLS
        run: >-
          bunx supabase test db --local
          supabase/tests/auth031_authorization_seed.sql

      - name: Verify DB-021 grant and function surface
        run: bunx supabase test db --local supabase/tests/db021_grants.sql

      - name: Verify the AUTH-030 API grant surface stays least-privilege
        run: bunx supabase test db --local supabase/tests/auth030_grants.sql

      - name: Verify API-040 durable idempotency and grant boundaries
        run: >-
          bunx supabase test db --local
          supabase/tests/api040_idempotency_seed.sql

      # API-041: transaction coupling (forced audit/outbox rollback),
      # idempotency completion, cross-tenant concealment and the least
      # privilege query/command surface.
      - name: Verify API-041 authoritative academic surface
        run: >-
          bunx supabase test db --local
          supabase/tests/api041_academic_seed.sql

      - name: Verify DB-020 query plans and provisional local latency bounds
        run: bun run test:db020:plans

      - name: Verify API-041 cursor query plans
        run: bun run test:api041:plans

      - name: Verify DB-021 RLS plans and provisional local latency bounds
        run: bun run test:db021:plans

      - name: Regenerate public database types (temporary diagnostic)
        run: bun run generate:db-types
      - name: Upload regenerated database types
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # temporary
        with:
          name: db-types
          path: packages/database/src/database.types.generated.ts
          retention-days: 1

      # ARC-010: read-only connectivity smoke from the workspace database
      # package against the disposable stack database.
      - name: Run database package connectivity smoke
        run: DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres bun test packages/database

      # AUTH-030: the repository suite exercises the real SQL through
      # postgres.js, which the fake-backed route tests cannot cover.
      - name: Run AUTH-030 repository integration suite
        run: DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres bun test apps/api/test/auth

      - name: Run AUTH-031 real /v1 and RLS parity integration suite
        run: >-
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          bun test apps/api/test/authorization/parity.integration.test.ts

      - name: Run API-040 concurrent PostgreSQL idempotency integration suite
        run: >-
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          bun test apps/api/test/platform/idempotency.integration.test.ts

      # API-041: the real /v1 academic route stack over the real database —
      # teacher/student/guardian slices, transactions, outbox and idempotent
      # replays end to end. This is the parity proof behind removing the
      # approve-paper-grade and publish-grade-result Edge Functions.
      - name: Run API-041 academic /v1 integration suite
        run: >-
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          bun test apps/api/test/academic/academic.integration.test.ts

      # SAFE-043: schema shape/RLS/no-grant assertions, then the surface
      # fixture (seed file includes safe043_surface.sql itself), proving the
      # reports/queue/masking/holds/blocks contract against the real stack.
      - name: Verify SAFE-043 safety schema shape and grants
        run: bunx supabase test db --local supabase/tests/safe043_safety_schema.sql

      - name: Verify SAFE-043 reporting, moderation, holds, and blocks surface
        run: bunx supabase test db --local supabase/tests/safe043_surface_seed.sql

      - name: Run SAFE-043 /v1 integration suite
        run: >-
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          bun test apps/api/test/safety/safety.integration.test.ts

      # On call: the drill drives the real SQL dispatcher through the whole
      # safeguarding lifecycle and exits non-zero on any step failing.
      - name: Run SAFE-043 moderation drill
        run: >-
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          bun scripts/moderation-drill.ts

      # End-to-end against the live local GoTrue: real ES256 tokens, real JWKS,
      # and the least-privilege database role.
      - name: Verify the AUTH-030 lifecycle end to end
        run: |
          # `status -o env` also prints a non-assignment "Stopped services"
          # line, so only KEY="value" lines are exported.
          eval "$(bunx supabase status -o env | grep -E '^[A-Z_]+="' | sed 's/^/export /')"
          SUPABASE_URL=http://127.0.0.1:54321 \
          SUPABASE_SECRET_KEY="$SECRET_KEY" \
          SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
          bun run test:auth030:lifecycle

      - name: Stop disposable Supabase stack
        if: always()
        run: bunx supabase stop --no-backup

  workspace:
    name: Bun workspace quality and containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4.4-alpine3.21@sha256:ee9e8748ace004102a267f7b8265dab2c618317df22507b89d16a8add7154273
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6

      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile

      - name: Verify workspace formatting
        run: bun run format:check

      - name: Lint workspace TypeScript
        run: bun run lint

      - name: Enforce architecture boundaries
        run: bun scripts/check-bounds.ts

      - name: Type-check all workspace members
        run: bun run typecheck

      - name: Run workspace tests
        run: bun test apps packages
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - name: Build API and worker bundles
        run: bun run --filter='@studafy/api' build && bun run --filter='@studafy/worker' build

      - name: Smoke API container (degraded readiness and graceful shutdown)
        run: |
          docker build -q -f apps/api/Dockerfile -t studafy-api .
          docker run -d --name api-smoke --network host \
            -e ENVIRONMENT=development -e REDIS_URL=redis://127.0.0.1:6379 studafy-api
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz)" = "503"
          curl -s http://127.0.0.1:8080/readyz | grep -q 'database_unreachable'
          curl -s http://127.0.0.1:8080/v1/me | grep -q 'NOT_IMPLEMENTED'
          docker stop -t 10 api-smoke
          test "$(docker inspect api-smoke --format '{{.State.ExitCode}}')" = "0"
          docker logs api-smoke 2>&1 | grep -q '"phase":"complete"'
          docker rm api-smoke >/dev/null

      - name: Smoke worker container (queue lifecycle and graceful shutdown)
        run: |
          docker build -q -f apps/worker/Dockerfile -t studafy-worker .
          docker run -d --name worker-smoke --network host \
            -e ENVIRONMENT=development -e REDIS_URL=redis://127.0.0.1:6379 studafy-worker
          for _ in $(seq 1 20); do
            docker logs worker-smoke 2>&1 | grep -q worker_ready && break; sleep 1
          done
          docker logs worker-smoke 2>&1 | grep -q worker_ready
          REDIS_URL=redis://127.0.0.1:6379 bun -e 'const m = await import("./packages/infrastructure/src/index.ts"); const q = m.createQueue("smoke", process.env.REDIS_URL, { prefix: "studafy-development" }); await q.add("smoke-job", { value: "ci-smoke" }); await m.closeQueue(q);'
          for _ in $(seq 1 20); do
            docker logs worker-smoke 2>&1 | grep -q job_processed && break; sleep 1
          done
          docker logs worker-smoke 2>&1 | grep -q job_processed
          docker stop -t 10 worker-smoke
          test "$(docker inspect worker-smoke --format '{{.State.ExitCode}}')" = "0"
          docker logs worker-smoke 2>&1 | grep -q '"phase":"complete"'
          docker rm worker-smoke >/dev/null

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action resolves the PR commit range through GitHub's pull
    # request API. Scope this read-only permission to this job only; comments
    # and artifact uploads remain disabled below.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked sensitive filenames
        run: .github/scripts/check-sensitive-files.sh

      - name: Scan history and working tree
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependency-scan:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Run locally in the job; do not request SARIF/code-scanning write access.
      - name: Scan Dart and Bun lockfiles for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./
