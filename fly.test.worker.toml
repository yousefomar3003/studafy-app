# Studafy worker - TEST copy on Fly.io (ADR-0035), paired with
# fly.test.api.toml. Development mode, like the Mac-hosted worker.
#   fly deploy --config fly.test.worker.toml
app = "studafy-worker-test"
primary_region = "fra"

[build]
  dockerfile = "apps/worker/Dockerfile"

[env]
  ENVIRONMENT = "development"
  LOG_LEVEL = "info"
  LOG_SAMPLE_SUCCESS_RATE = "0.1"
  LOG_SAMPLE_ROUTINE_RATE = "0.01"
  DATABASE_POOL_MAX = "5"
  # Supabase's session pooler: the 6543 (transaction pooler) DATABASE_URL
  # secret is moved to port 5432 on the same host, same login. Through the
  # transaction pooler, pipelined statements were stranded and the worker
  # stalled (2026-10-20); production refuses 6543 without this. In session
  # mode every pooled connection holds one of the role's Pool Size slots
  # (docs/deployment/fly-io.md, "Database connection budget").
  DATABASE_POOLER_MODE = "session"
  OPS061_NOTIFICATIONS_ENABLED = "true"
  FILE051_SCAN_ENABLED = "true"
  FILE050_CLEANUP_ENABLED = "true"
  # Removes the bytes of files whose retention has ended. No file purpose
  # sets a retention period yet, so today this removes only the personal
  # files (profile image, notebook photo, AI-helper photo) of deleted
  # accounts (launch plan 3.6b, 202610110004).
  FILE051_RETENTION_ENABLED = "true"
  DB_HOUSEKEEPING_ENABLED = "true"
  # Account rights (DL-051): deletions run after their 14-day grace period,
  # exports are built for download. Without these a request is accepted and
  # never carried out (launch plan 2.1).
  ACCOUNT_DELETION_EXECUTOR_ENABLED = "true"
  DATA_EXPORT_EXECUTOR_ENABLED = "true"
  # Email and push, as in production (DL-070): each channel runs once its
  # keys are secrets (FCM_PROJECT_ID + FCM_SERVICE_ACCOUNT_JSON for push,
  # RESEND_API_KEY + EMAIL_FROM_ADDRESS for email); without them nothing is
  # fanned out.
  NOTIFICATION_CHANNELS_ENABLED = "true"
  # Google Play billing in test (work plan 3.9): license testers buy on the
  # internal-testing build. The store's public settings are here; the Play
  # API key (GOOGLE_SERVICE_ACCOUNT_JSON) is a secret. Pub/Sub pushes to
  # /webhooks/google, signed by the push account below for this audience.
  PAY071_BILLING_ENABLED = "true"
  PAY071_ENVIRONMENT = "development"
  GOOGLE_PACKAGE_NAME = "com.studafy.light"
  GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL = "studafy-pubsub-push@studafy-lite.iam.gserviceaccount.com"
  GOOGLE_PUBSUB_AUDIENCE = "https://studafy-api-test.fly.dev/webhooks/google"
  PAY071_RECONCILIATION_ENABLED = "true"
  # ADR-0037: lesson files and links read for the study helper. The model
  # key (AI_API_KEY) is a secret; the origin and model are not.
  AI_MATERIAL_INDEX_ENABLED = "true"
  AI_LESSON_TOOLS_ENABLED = "true"
  # ADR-0046: suggested marks, as on the test API.
  MARKING_SUGGESTIONS_ENABLED = "true"
  AI_BASE_URL = "https://api.together.xyz"
  AI_MODEL = "Qwen/Qwen3.5-9B"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
