# Lints for the Flutter app. flutter_lints is the base; the rules below are
# the ones this codebase holds itself to on top of it.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    # A value from JSON or a platform channel is `dynamic`; it must be
    # checked before use, never assumed.
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # A future nobody awaits hides its failure.
    - unawaited_futures
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - always_declare_return_types
    - prefer_single_quotes
    - directives_ordering
